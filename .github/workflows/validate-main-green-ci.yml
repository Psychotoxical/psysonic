name: Validate Main Green CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to validate"
        required: false
        default: main
        type: string
      required_contexts:
        description: "Comma-separated required check names (exact check run name)"
        required: false
        default: ci-main / ci-ok
        type: string
  workflow_call:
    inputs:
      branch:
        required: false
        default: main
        type: string
      required_contexts:
        required: false
        default: ci-main / ci-ok
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: read
    steps:
      - name: validate required checks
        uses: actions/github-script@v7
        env:
          TARGET_BRANCH: ${{ inputs.branch || github.event.inputs.branch || 'main' }}
          REQUIRED_CONTEXTS: ${{ inputs.required_contexts || github.event.inputs.required_contexts || 'ci-main / ci-ok' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.TARGET_BRANCH || "main";
            const required = String(process.env.REQUIRED_CONTEXTS || "")
              .split(",")
              .map((s) => s.trim())
              .filter(Boolean);

            const runId = String(context.runId);
            const branchResp = await github.rest.repos.getBranch({ owner, repo, branch });
            const sha = branchResp.data.commit.sha;
            core.info(`Validating checks for ${branch} @ ${sha}`);

            const checksAll = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: sha,
              per_page: 100,
            });
            const checks = checksAll.filter((c) => !(c.details_url || "").includes(`/actions/runs/${runId}/`));

            const newestByName = new Map();
            for (const c of checks) {
              const key = c.name;
              const prev = newestByName.get(key);
              if (!prev) {
                newestByName.set(key, c);
                continue;
              }
              const prevTime = Date.parse(prev.started_at || prev.completed_at || "") || 0;
              const curTime = Date.parse(c.started_at || c.completed_at || "") || 0;
              if (curTime >= prevTime) {
                newestByName.set(key, c);
              }
            }

            const failures = [];
            for (const ctx of required) {
              const latest = newestByName.get(ctx);
              if (!latest) {
                failures.push(`${ctx}: missing`);
                continue;
              }
              if (latest.status !== "completed") {
                failures.push(`${ctx}: status=${latest.status}, conclusion=${latest.conclusion}`);
                continue;
              }
              if (!["success", "neutral", "skipped"].includes(latest.conclusion || "")) {
                failures.push(`${ctx}: conclusion=${latest.conclusion}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(`Required checks for ${branch} are not green:\n${failures.join("\n")}`);
              return;
            }

            core.info(`All required checks for ${branch} are green (${required.join(", ")}).`);
